services:
  streamlit-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: iron-ledger-dev
    volumes:
      - .:/app
    ports:
      - "8585:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: streamlit run web/app.py --server.port=8501 --server.address=0.0.0.0
