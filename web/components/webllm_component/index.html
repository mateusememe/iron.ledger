<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; color: #333; margin: 0; padding: 4px; background: transparent; }
    #status { font-size: 13px; padding: 10px 14px; border-radius: 8px; background: #f0f2f6; display: flex; align-items: center; gap: 10px; border: 1px solid #e0e2e6; color: #1f2937; }
    .spinner { border: 2px solid #cbd5e1; border-top: 2px solid #2563eb; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status"><div class="spinner" id="spinner"></div><span id="text">Connecting to Streamlit...</span></div>

  <script>
    // Global state
    let engine = null;
    let isProcessing = false;
    let initialized = false;
    let webLlmModule = null;

    function sendValue(value) {
      if (window.Streamlit) {
        window.Streamlit.setComponentValue(value);
      }
    }

    function setStatus(msg, loading = false) {
      const textEl = document.getElementById('text');
      const spinnerEl = document.getElementById('spinner');
      if (textEl) textEl.innerText = msg;
      if (spinnerEl) spinnerEl.style.display = loading ? 'inline-block' : 'none';
      if (window.Streamlit) {
        window.Streamlit.setFrameHeight(60);
      }
    }

    async function loadWebLLM() {
      if (!webLlmModule) {
        setStatus("Loading WebLLM engine from CDN...", true);
        webLlmModule = await import("https://esm.run/@mlc-ai/web-llm");
      }
      return webLlmModule;
    }

    async function onRender(event) {
      const data = event.detail.args;

      // First render: initialize model
      if (!initialized && !isProcessing) {
        isProcessing = true;
        try {
          if (!navigator.gpu) {
            throw new Error("WebGPU is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          }
          const { CreateMLCEngine } = await loadWebLLM();
          setStatus("Downloading model (Llama-3.1-8B)...", true);
          
          engine = await CreateMLCEngine("Llama-3.1-8B-Instruct-q4f32_1-MLC", {
            initProgressCallback: (progress) => {
              setStatus(progress.text, true);
            }
          });

          setStatus("WebLLM Engine Ready! Waiting for input.");
          initialized = true;
          sendValue({ status: "ready" });
        } catch (err) {
          setStatus("Error: " + err.message);
          sendValue({ status: "error", error: err.message });
        }
        isProcessing = false;
        return;
      }

      // Handle prompt execution
      if (data.prompt && engine && !isProcessing && data.prompt !== window.lastPrompt) {
        window.lastPrompt = data.prompt;
        isProcessing = true;
        setStatus("Generating structured workout JSON...", true);

        try {
          const reply = await engine.chat.completions.create({
            messages: [
              {
                role: "system",
                content: `You are a fitness assistant. Convert the user's workout text to JSON matching this exact structure:
{
  "name": "Workout Title",
  "workouts": [
    {
      "title": "Day Title",
      "notes": "Notes",
      "exercises": [
        {
          "name": "Exercise Name in English (e.g. Bench Press (Barbell))",
          "rest_seconds": 60,
          "notes": "Technique note",
          "sets": [{ "type": "normal", "reps": 10, "weight_kg": 50 }]
        }
      ]
    }
  ]
}
Return ONLY valid JSON.`
              },
              { role: "user", content: data.prompt }
            ]
          });

          setStatus("Generation complete!");
          sendValue({ status: "success", text: reply.choices[0].message.content });
        } catch (err) {
          setStatus("Error generating: " + err.message);
          sendValue({ status: "error", error: err.message });
        }
        isProcessing = false;
      }
    }

    // IMMEDIATELY notify Streamlit that component is ready before async imports
    if (window.Streamlit) {
      window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, onRender);
      window.Streamlit.setComponentReady();
      window.Streamlit.setFrameHeight(60);
      setStatus("WebLLM Component loaded. Ready for initialization.");
    }
  </script>
</body>
</html>
