<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
  <style>
    body { font-family: sans-serif; color: #333; margin: 0; padding: 10px; background: transparent; }
    #status { font-size: 14px; padding: 12px; border-radius: 8px; background: #f0f2f6; display: flex; align-items: center; gap: 10px; border: 1px solid #e0e2e6;}
    .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status"><div class="spinner" id="spinner"></div><span id="text">Initializing WebLLM Component...</span></div>
  
  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let isProcessing = false;
    let initialized = false;

    function sendValue(value) {
      Streamlit.setComponentValue(value);
    }

    function setStatus(msg, loading=false) {
      document.getElementById('text').innerText = msg;
      document.getElementById('spinner').style.display = loading ? 'block' : 'none';
      Streamlit.setFrameHeight();
    }

    async function onRender(event) {
      const data = event.detail.args;
      
      // Initialize model on first render
      if (!initialized && !isProcessing) {
        isProcessing = true;
        try {
            if (!navigator.gpu) {
                throw new Error("WebGPU is not supported in this browser. Please use Chrome/Edge 113+.");
            }
            setStatus("Downloading model weights (this may take a few minutes on first run)...", true);
            const initProgressCallback = (initProgress) => {
                setStatus(initProgress.text, true);
            };
            // Using a lighter model for faster browser execution
            engine = await CreateMLCEngine("Llama-3.1-8B-Instruct-q4f32_1-MLC", { initProgressCallback });
            setStatus("WebLLM Engine Ready! Awaiting input.");
            initialized = true;
            sendValue({ status: "ready" });
        } catch (e) {
            setStatus("Error initializing model: " + e.toString());
            sendValue({ status: "error", error: e.toString() });
        }
        isProcessing = false;
        return;
      }

      // Handle prompt execution
      if (data.prompt && engine && !isProcessing && data.prompt !== window.lastPrompt) {
        window.lastPrompt = data.prompt;
        isProcessing = true;
        setStatus("Generating structured workout (this may take a moment)...", true);
        
        try {
            const reply = await engine.chat.completions.create({
              messages: [
                { 
                  role: "system", 
                  content: `You are a helpful fitness assistant. 
The user will provide a workout in natural language. You must return a JSON representation of the workout matching this schema:

{
  "name": "Workout Title",
  "workouts": [
    {
      "title": "Day 1...",
      "notes": "Any notes",
      "exercises": [
        {
          "name": "Exercise Name",
          "rest_seconds": 60,
          "notes": "form tips",
          "sets": [
            { "type": "normal", "reps": 10, "weight_kg": 50 }
          ]
        }
      ]
    }
  ]
}

Ensure exercise names use standard English terms (e.g. "Bench Press (Barbell)", "Squat (Barbell)", "Lat Pulldown (Cable)").
Respond ONLY with valid JSON.` 
                },
                { role: "user", content: data.prompt }
              ],
              // Note: response_format type json_object support varies by MLC model, but prompt engineering usually suffices
            });
            setStatus("Generation complete!");
            sendValue({ status: "success", text: reply.choices[0].message.content });
        } catch (err) {
            setStatus("Error generating: " + err.toString());
            sendValue({ status: "error", error: err.toString() });
        }
        isProcessing = false;
      }
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight();
  </script>
</body>
</html>
